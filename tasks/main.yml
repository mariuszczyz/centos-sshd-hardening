---
# tasks file for centos-sshd-hardening

- name: Check for authorized SSH keys before disabling password authentication
  ansible.builtin.stat:
    path: "{{ (item == 'root') | ternary('/root', '/home/' + item) }}/.ssh/authorized_keys"
  loop: "{{ (['root'] + sshd_hardening_allowed_users) | unique }}"
  register: sshd_hardening_key_files
  when: sshd_hardening_disable_password

- name: Fail when no authorized key would survive a password-authentication shutdown
  ansible.builtin.assert:
    that:
      - sshd_hardening_key_files.results | map(attribute='stat.exists') | select | list | length > 0
    fail_msg: >-
      Disabling password authentication without an authorized_keys file for
      root or an allowed user locks everyone out. Deploy SSH keys first.
  when: sshd_hardening_disable_password

- name: Write the sshd hardening drop-in configuration
  ansible.builtin.template:
    src: hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd
