---
# defaults file for centos-sshd-hardening

# Set to true to deny SSH login for the root account.
sshd_hardening_disable_root: true

# Set to true to apply the client idle timeout settings below.
sshd_hardening_adjust_idle: true

# Seconds of idle time before the server sends a keepalive probe.
sshd_hardening_client_alive_interval: 300

# Number of failed keepalive probes before the server drops the session.
sshd_hardening_client_alive_count_max: 2

# Users allowed to connect over SSH. An empty list allows all users.
sshd_hardening_allowed_users: []

# TCP port the SSH server listens on. Changing this can lock you out.
sshd_hardening_port: 22

# Set to true to accept only key-based authentication. Deploy keys first.
sshd_hardening_disable_password: true

# Set to true to disable X11 forwarding.
sshd_hardening_disable_x11_forwarding: true
